<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christian AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background-color: #FAFAF8;
            color: #2D3748;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #4A6FA5;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-container {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            max-width: 80%;
        }

        .message.user {
            background-color: #4A6FA5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background-color: white;
            color: #2D3748;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message.assistant.error {
            background-color: #FED7D7;
            color: #C53030;
        }

        .verses {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(74, 111, 165, 0.2);
            font-size: 0.875rem;
        }

        .verse-ref {
            color: #4A6FA5;
            font-weight: 500;
        }

        .verse-text {
            color: #718096;
            margin-top: 0.25rem;
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid #E2E8F0;
        }

        .input-container input {
flex: 1;
            padding: 0.875rem 1rem;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-container input:focus {
            border-color: #4A6FA5;
        }

        .input-container button {
            background-color: #C9A227;
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-container button:hover {
            background-color: #B8921F;
        }

        .input-container button:disabled {
            background-color: #A0AEC0;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            padding: 2rem;
            color: #718096;
        }

        .welcome h2 {
            color: #2D3748;
            margin-bottom: 1rem;
        }

        .welcome p {
            margin-bottom: 0.5rem;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .suggestion {
            background-color: #EDF2F7;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .suggestion:hover {
            background-color: #E2E8F0;
        }

        /* Dark mode */
        body.dark {
            background-color: #1A1A2E;
            color: #E2E8F0;
        }

        body.dark .message.assistant {
            background-color: #2D3748;
            color: #E2E8F0;
        }

        body.dark .input-container input {
            background-color: #2D3748;
            border-color: #4A5568;
            color: #E2E8F0;
        }

        body.dark .input-container input:focus {
            border-color: #C9A227;
        }

        body.dark .welcome {
            color: #A0AEC0;
        }

        body.dark .welcome h2 {
            color: #E2E8F0;
        }

        body.dark .suggestion {
            background-color: #4A5568;
            color: #E2E8F0;
        }

        body.dark .suggestion:hover {
            background-color: #5A6A7A;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #718096;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background-color: #4A6FA5;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Christian AI Assistant</h1>
        <button class="theme-toggle" onclick="toggleTheme()">Dark Mode</button>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="welcome">
                <h2>Welcome</h2>
                <p>A faithful AI companion for Christians</p>
                <p>Ask me about the Bible, faith, or Christian topics</p>
                <div class="suggestions">
                    <button class="suggestion" onclick="askQuestion('What does the Bible say about love?')">Love in the Bible</button>
                    <button class="suggestion" onclick="askQuestion('Explain the Ten Commandments')">Ten Commandments</button>
                    <button class="suggestion" onclick="askQuestion('What is salvation?')">What is Salvation?</button>
                    <button class="suggestion" onclick="askQuestion('Tell me about prayer')">About Prayer</button>
                    <button class="suggestion" onclick="generateImage('peaceful Bible verse illustration')">Generate Image</button>
                </div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
            <button id="sendButton" onclick="sendMessage()">Send</button>
            <button id="imageButton" onclick="showImagePrompt()" title="Generate Image">🎨</button>
        </div>

        <div id="imageModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
            <div style="background:white; padding:2rem; border-radius:12px; max-width:400px; width:90%;">
                <h3 style="margin-bottom:1rem;">Generate Christian Image</h3>
                <input type="text" id="imagePromptInput" placeholder="Describe the image you want..." style="width:100%; padding:0.75rem; border:1px solid #E2E8F0; border-radius:8px; margin-bottom:1rem;">
                <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                    <button onclick="closeImageModal()" style="padding:0.5rem 1rem; border:none; background:#E2E8F0; border-radius:6px; cursor:pointer;">Cancel</button>
                    <button onclick="submitImageGeneration()" style="padding:0.5rem 1rem; border:none; background:#C9A227; color:white; border-radius:6px; cursor:pointer;">Generate</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let conversationId = null;
        let darkMode = false;

        function toggleTheme() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            document.querySelector('.theme-toggle').textContent = darkMode ? 'Light Mode' : 'Dark Mode';
            localStorage.setItem('darkMode', darkMode);
        }

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            darkMode = true;
            document.body.classList.add('dark');
            document.querySelector('.theme-toggle').textContent = 'Light Mode';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function askQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const button = document.getElementById('sendButton');
            const message = input.value.trim();

            if (!message) return;

            // Clear input and disable button
            input.value = '';
            button.disabled = true;

            // Remove welcome message if present
            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage(message, 'user');

            // Add loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
            document.getElementById('chatMessages').appendChild(loadingDiv);
            scrollToBottom();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: conversationId,
                        denomination: 'Protestant'
                    })
                });

                const data = await response.json();

                // Remove loading indicator
                loadingDiv.remove();

                if (data.flagged) {
                    addMessage(data.response, 'assistant error');
                } else {
                    addMessage(data.response, 'assistant', data.verses);
                    conversationId = data.conversation_id;
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant error');
            }

            button.disabled = false;
            input.focus();
        }

        function addMessage(content, type, verses = []) {
            const div = document.createElement('div');
            div.className = `message ${type}`;

            // Convert markdown headers to HTML
            let html = content
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');

            div.innerHTML = html;

            if (verses && verses.length > 0) {
                const versesDiv = document.createElement('div');
                versesDiv.className = 'verses';
                versesDiv.innerHTML = '<strong>Scripture References:</strong><br>';
                verses.forEach(v => {
                    versesDiv.innerHTML += `<div class="verse-ref">${v.reference}</div>`;
                    versesDiv.innerHTML += `<div class="verse-text">${v.text}</div><br>`;
                });
                div.appendChild(versesDiv);
            }

            document.getElementById('chatMessages').appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        function showImagePrompt() {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('imagePromptInput').focus();
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('imagePromptInput').value = '';
        }

        async function submitImageGeneration() {
            const input = document.getElementById('imagePromptInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            closeImageModal();

            // Add user message
            addMessage(`Generate image: ${prompt}`, 'user');

            // Add loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = '<div class="loading">Generating image...</div>';
            document.getElementById('chatMessages').appendChild(loadingDiv);
            scrollToBottom();

            try {
                const response = await fetch('/generate-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        conversation_id: conversationId
                    })
                });

                const data = await response.json();
                loadingDiv.remove();

                if (data.success && data.image_url) {
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'message assistant';
                    imgDiv.innerHTML = `<p>Here's your generated image:</p><img src="${data.image_url}" style="max-width:100%; border-radius:8px; margin-top:0.5rem;" alt="Generated Christian image">`;
                    document.getElementById('chatMessages').appendChild(imgDiv);
                } else {
                    addMessage('Sorry, image generation failed. Please try again.', 'assistant error');
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant error');
            }

            scrollToBottom();
        }

        function generateImage(prompt) {
            document.getElementById('imagePromptInput').value = prompt;
            submitImageGeneration();
        }
    </script>
</body>
</html>
